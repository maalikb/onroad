version: "3.9"

services:
  client:
    image: ghcr.io/malikbagwala/onroad/client:${VERSION:-latest}
    container_name: or_client
    build:
      context: ./client
      dockerfile: Dockerfile.client
      tags:
        - ghcr.io/malikbagwala/onroad/client:${COMMIT:-latest}
      args:
        - API_DOMAIN=${DOMAIN_NAME}
        - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - django
      - hasura
      - caddy

  django:
    image: ghcr.io/malikbagwala/onroad/api:${VERSION:-latest}
    container_name: or_django
    build:
      dockerfile: ./Dockerfile.api
      tags:
        - ghcr.io/malikbagwala/onroad/api:${COMMIT:-latest}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      - db
      - caddy

  worker:
    image: ghcr.io/malikbagwala/onroad/api:${VERSION:-latest}
    container_name: or_worker
    build:
      dockerfile: ./Dockerfile.api
      tags:
        - ghcr.io/malikbagwala/onroad/api:${COMMIT:-latest}
    command: python manage.py rundramatiq
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      - db
      - rabbitmq

  caddy:
    image: ghcr.io/malikbagwala/onroad/caddy:${VERSION:-latest}
    restart: unless-stopped
    build:
      context: ./caddy
      dockerfile: Dockerfile.caddy
      tags:
        - ghcr.io/malikbagwala/onroad/caddy:${COMMIT:-latest}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/cert.crt:/etc/pki/tls/certs/cert.crt
      - ./caddy/cert.key:/etc/pki/tls/private/cert.key
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - TLS=${TLS}
      - TLS_KEY=${TLS_KEY}
      - RATE_LIMIT=${RATE_LIMIT}
    container_name: or_caddy
    ports:
      - "80:80"
      - "443:443"

  db:
    image: postgis/postgis:16-master
    container_name: or_database
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  rabbitmq:
    image: rabbitmq:3-management
    container_name: or_rabbitmq
    restart: always
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}

  hasura:
    image: ghcr.io/malikbagwala/onroad/hasura:${VERSION:-latest}
    container_name: or_hasura
    build:
      context: ./hasura
      dockerfile: Dockerfile.hasura
      tags:
        - ghcr.io/malikbagwala/onroad/hasura:${COMMIT:-latest}
    restart: unless-stopped
    depends_on:
      - "db"
      - "django"
      - "caddy"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${JWT_SECRET_KEY}","claims_namespace":"user_claims","claims_format":"json"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "anonymous"
      HASURA_GRAPHQL_MIGRATIONS_SERVER_TIMEOUT: 120
      HASURA_GRAPHQL_CORS_DOMAIN: ${CSRF_TRUSTED_ORIGINS}
      API_HOST: "http://django:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mail:
    container_name: or_plausible_mail
    image: bytemark/smtp
    restart: always

  plausible_db:
    # supported versions are 12, 13, and 14
    container_name: or_plausible_postgres
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - plausible_postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${PLAUSIBLE_POSTGRES_PASSWORD}

  plausible_events_db:
    container_name: or_plausible_clickhouse
    image: clickhouse/clickhouse-server:23.3.7.5-alpine
    restart: unless-stopped
    volumes:
      - plausible_clickhouse:/var/lib/clickhouse
      - ./plausible/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./plausible/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  plausible:
    container_name: or_plausible
    image: plausible/analytics:v2.0
    restart: unless-stopped
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      - plausible_db
      - plausible_events_db
      - mail
      - caddy
    environment:
      - BASE_URL=${PLAUSIBLE_BASE_URL}
      - SECRET_KEY_BASE=${PLAUSIBLE_SECRET_KEY_BASE}

volumes:
  postgres:
  rabbitmq:
  caddy_data:
  caddy_config:
  plausible_postgres:
  plausible_clickhouse:
